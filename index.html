<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f2ece0;
    display: flex;
    justify-content: center;
    padding: 24px;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }
 
  .sidebar {
    width: 270px;
    background: #f2ece0;
    border-radius: 24px;
    padding: 32px 22px;
    color: #4a3f35;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
 
  /* โลโก้ */
  .logo-badge {
    width: 88px;
    height: 88px;
    margin: 0 auto 4px;
    border-radius: 50%;
    background: #c0392b;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f2ece0;
    font-size: 34px;
    font-weight: 700;
    position: relative;
  }
  .logo-badge::before,
  .logo-badge::after {
    content: "❀";
    position: absolute;
    color: #c0392b;
    font-size: 16px;
  }
  .logo-badge::before { top: -6px; left: -10px; }
  .logo-badge::after  { top: -2px; right: -14px; }
 
  .brand-title {
    text-align: center;
    font-family: 'Brush Script MT', cursive;
    font-size: 30px;
    margin: 10px 0 4px;
    color: #2c2c2c;
  }
 
  .brand-sub {
    text-align: center;
    font-size: 13px;
    line-height: 1.5;
    color: #6b5f52;
    margin-bottom: 8px;
  }
 
  .accent-line {
    width: 40px;
    height: 3px;
    background: #c0392b;
    border-radius: 3px;
    margin: 0 auto 20px;
  }
 
  /* เมนู */
  nav ul {
    list-style: none;
    margin: 0 0 28px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  nav a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 10px;
    text-decoration: none;
    color: #4a3f35;
    font-size: 14px;
    transition: background 0.15s, color 0.15s;
  }
  nav a i { font-style: normal; width: 18px; text-align: center; }
  nav a:hover { background: #e7ddc9; }
  nav a.active {
    background: #c0392b;
    color: #fff;
  }
 
  /* ภูเขา decorative */
  .mountain { margin: 8px 0 4px; }
 
  .quote {
    text-align: center;
    margin: 4px 0 20px;
  }
  .quote .cn {
    font-size: 15px;
    font-weight: 600;
    color: #2c2c2c;
  }
  .quote .th {
    font-size: 12px;
    color: #6b5f52;
    margin-top: 6px;
    line-height: 1.5;
  }
 
  .footer-art { text-align: center; }
        .card2 {
            background:white ;
            padding: 30px;
            border-radius: 50px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 150px;
            margin: 0 auto;
        }
        .card {
            background:white ;
            padding: 30px;
            border-radius: 50px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
        }
       .button {
    display: inline-block;
    background: blue;
    color: white;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 5px;
    transition: 0.2s;
}
.button:hover {
    background: red;
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 6px 12px rgba(0,0,0,0.2);
}
        h1 { color: #2c3e50; }
        p { font-size: 18px; line-height: 1.6; }
    </style>
</head>
<body>
<aside class="sidebar">
 
    <div class="logo-badge">学</div>
    <div class="brand-title">Thanida</div>
    <div class="brand-sub">เส้นทางสู่อนาคต<br>ที่อยากไปให้ถึง</div>
    <div class="accent-line"></div>
 
    <nav>
      <ul>
        <li><a href="#" class="active"><i>🏠</i> หน้าแรก</a></li>
        <li><a href="#"><i>👤</i> เกี่ยวกับฉัน</a></li>
        <li><a href="#"><i>🎓</i> ประวัติการศึกษา</a></li>
        <li><a href="#"><i>⭐</i> ทักษะและความสามารถ</a></li>
        <li><a href="#"><i>📖</i> ผลงาน / กิจกรรม</a></li>
        <li><a href="#"><i>🎯</i> เป้าหมายในอนาคต</a></li>
        <li><a href="#"><i>✉️</i> ติดต่อ</a></li>
      </ul>
    </nav>
 
    <svg class="mountain" viewBox="0 0 230 90" width="100%" height="90">
      <polygon points="0,90 45,25 75,55 110,10 160,60 190,35 230,90" fill="#c9c2b3"/>
      <polygon points="30,90 75,45 110,70 160,30 230,90" fill="#b6ae9c" opacity="0.7"/>
    </svg>
 
    <div class="quote">
      <div class="cn">"学习中文<br>打开更大的世界"</div>
      <div class="th">เรียนภาษาจีน<br>เพื่อเปิดโลกที่กว้างขึ้น</div>
    </div>
 
    <div class="footer-art">
      <svg viewBox="0 0 100 60" width="90" height="54">
        <ellipse cx="50" cy="45" rx="26" ry="14" fill="#f2ece0" stroke="#4a3f35" stroke-width="1.5"/>
        <circle cx="38" cy="26" r="13" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
        <circle cx="30" cy="16" r="5" fill="#2c2c2c"/>
        <circle cx="46" cy="16" r="5" fill="#2c2c2c"/>
        <circle cx="33" cy="27" r="3.5" fill="#2c2c2c"/>
        <circle cx="43" cy="27" r="3.5" fill="#2c2c2c"/>
      </svg>
    </div>
 
  </aside>
</body>
</html>
